services:
  # ============================================
  # Docker Registry - Lưu trữ Docker Images
  # Port mặc định: 5000
  # ============================================
  registry:
    image: registry:2
    container_name: docker-registry
    restart: always
    ports:
      - "5000:5000"
    volumes:
      # Config YAML được mount vào thay vì dùng environment variables
      - ./config/registry-config.yml:/etc/docker/registry/config.yml:ro
      # Thư mục lưu trữ images
      - ./data:/var/lib/registry
      # File xác thực htpasswd
      - ./auth:/auth

  # ============================================
  # Registry UI - Giao diện quản lý
  # Port: 5001 (host) -> 80 (container)
  # ============================================
  registry-ui:
    image: joxit/docker-registry-ui:latest
    container_name: registry-ui
    restart: always
    ports:
      - "5001:80"
    environment:
      - REGISTRY_URL=http://registry:5000
      - DELETE_IMAGES=true
      - REGISTRY_TITLE=Private Docker Registry
    depends_on:
      - registry
